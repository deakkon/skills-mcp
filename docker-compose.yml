services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: skills-mcp-qdrant
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - skills_mcp_qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  skills-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skills-mcp-app
    env_file:
      - .env
    environment:
      ENV_FILE: /app/.env
    working_dir: /app
    volumes:
      - ${HOST_SKILLS_ROOT:-/Users/jurica/agent-skill-library/skills}:/skills:ro
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: false

volumes:
  skills_mcp_qdrant_storage:
