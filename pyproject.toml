[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-mcp"
version = "1.2.0"
description = "Self-hostable Agent Skills registry over MCP - Cloudflare Workers + Workers AI + Qdrant Cloud. Enhanced with structured metadata, new browsing tool, and 33 production-ready skills from official sources."
requires-python = ">=3.11"

# Runtime deps for the Cloudflare Worker (installed by wrangler into the Worker bundle)
dependencies = [
    "mcp>=1.5.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.0",
    "requests>=2.33.1",
    "fastmcp>=2.0.0",
    "qdrant-client>=1.9.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.1.0",
    "PyYAML>=6.0.0",
    "uvicorn>=0.29.0",
    "openrouter>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "workers-py",
]

[project.scripts]
skill-mcp-seed = "skill_mcp.seed.seed_skills:main"
skill-mcp-local = "skill_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_mcp*"]
